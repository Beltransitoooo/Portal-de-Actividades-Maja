services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal_actividades}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el .env de la raíz}
    ports:
      - "127.0.0.1:5433:5432"   # solo accesible desde este equipo
    volumes:
      - pgdata:/var/lib/postgresql/data     # Guarda datos de la DB

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "80:80"
    depends_on:
      - backend

  # Respaldo diario de la BD de Supabase. Solo arranca si se pide su perfil:
  #   docker compose --profile backup up -d backup
  # Requiere .env.backup con SUPABASE_DB_URL (ver README).
  backup:
    image: postgres:17
    profiles: ["backup"]
    env_file:
      - path: ./.env.backup
        required: false
    volumes:
      - ./backups:/backups
      - ./scripts/backup_loop.sh:/backup_loop.sh:ro
    environment:
      TZ: America/Mexico_City   # fechas de archivos y log en hora local
    entrypoint: ["sh", "/backup_loop.sh"]
    restart: unless-stopped

volumes:
  pgdata: